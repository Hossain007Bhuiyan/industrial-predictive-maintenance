[project]
name = "industrial-predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance for rolling bearings using real run-to-failure vibration data"
readme = "README.md"
authors = [
    { name = "Md Motaher Hossain Bhuiyan", email = "hossain.se@outlook.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.scripts]
industrial-predictive-maintenance = "industrial_predictive_maintenance:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
